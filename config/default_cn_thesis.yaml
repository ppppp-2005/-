# 通用中文学位论文排版规则（可仿照来写作：每校一份 yaml + 可选模板 docx）
name: 通用本科论文
description: 适用于大多数学校的默认规则，可按学校复制后微调

page:
  width_cm: 21.0
  height_cm: 29.7
  margin_top_cm: 2.5
  margin_bottom_cm: 2.5
  margin_left_cm: 3.0
  margin_right_cm: 2.0

styles:
  body:
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 12
    line_spacing: 1.5
    first_line_indent_cm: 0.74
    alignment: justify

  heading1:
    font_cn: 黑体
    size_pt: 16
    bold: true
    alignment: center
    space_before_pt: 12
    space_after_pt: 12
    page_break_before: false

  heading2:
    font_cn: 黑体
    size_pt: 14
    bold: true
    alignment: left
    space_before_pt: 6
    space_after_pt: 6

  heading3:
    font_cn: 黑体
    size_pt: 12
    bold: true
    alignment: left
    space_before_pt: 3
    space_after_pt: 3

  abstract_title:
    font_cn: 黑体
    size_pt: 16
    bold: true
    alignment: center

  keywords:
    font_cn: 宋体
    size_pt: 12
    bold_label: true

# 段落分类：按文本模式识别后套用 styles 里的样式
rules:
  - type: heading1
    patterns:
      - "^第\\s*[一二三四五六七八九十百]+\\s*章\\s+\\S"
      - "^第\\s*\\d+\\s*章\\s+\\S"
      - "^[1-9]\\s+绪论"
      - "^绪论$"
      - "^引言$"
      - "^结论$"

  - type: heading2
    patterns:
      - "^\\d+\\.\\d+\\s+\\S"
      - "^[一二三四五六七八九十]+、"
      - "^（[一二三四五六七八九十]+）"

  - type: heading3
    patterns:
      - "^\\d+\\.\\d+\\.\\d+\\s+\\S"

  - type: heading4
    patterns:
      - "^\\d+\\.\\d+\\.\\d+\\.\\d+\\s+\\S"

  - type: abstract_title
    patterns:
      - "^摘\\s*要$"
      - "^Abstract$"

  - type: keywords
    patterns:
      - "^关键词[：:]"
      - "^Keywords[：:]"
      - "^Key\\s+words[：:]"

  - type: references_title
    patterns:
      - "^参考文献$"
      - "^References$"

  - type: acknowledgment
    patterns:
      - "^致\\s*谢$"

# 封面/前置页设置
front_matter:
  # 封面来源：
  #   template = 以模板为基底，保留模板封面/前置页，正文换成你的并套模板格式（推荐）
  #   article  = 保留你自己论文的封面/声明页，只对正文套模板格式
  #   none     = 不要封面，输出直接从摘要/第1章开始
  cover_source: template
  # 正文起点：在此之前的段落视为封面/声明等前置页，原样保留
  # abstract_or_chapter | abstract | chapter
  body_start_at: abstract_or_chapter
